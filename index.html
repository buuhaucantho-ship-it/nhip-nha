<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Nhịp Nhà – công cụ giúp học sinh nội trú và gia đình nhận ra nhịp trò chuyện của nhà mình và cùng chỉnh lại qua hành trình CHẠM 4 tuần.">
<meta name="theme-color" content="#E9DCCB">
<meta property="og:title" content="Nhịp Nhà">
<meta property="og:description" content="Mỗi nhịp chạm, thêm một nhịp thương. Không cần thay đổi tất cả trong một ngày, chỉ cần mỗi ngày hiểu nhau thêm một chút.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Nhịp Nhà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: ứng dụng một cột kiểu điện thoại (tối đa 640px), thanh tab cố định dưới đáy; mỗi khu vực một màu pastel như bản phác của nhóm */
:root{
  --bg:#E9DCCB; --glow:#F3E8DA; --surface:#FFF9F2; --ink:#3B2F27; --muted:#65554A; --line:#E3D2BF; --on:#FFFFFF;
  --brand:#D4513F; --brand-s:#FFD8CC;
  --pink:#CC4479;  --pink-s:#FFD5E6;
  --violet:#7457D3; --violet-s:#E2D8FF;
  --yellow:#A86E00; --yellow-s:#FFE7A8;
  --blue:#2B78BD;  --blue-s:#CDE5FF;
  --peach:#C95E1F; --peach-s:#FFDBBC;
  --l1:#2F87CC; --l2:#D99A0F; --l3:#E56F2E; --l4:#D2435A;
  --f-display:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --r:22px;
  --sheen:rgba(255,255,255,.55); --sky1:#FFE4D2; --sky2:#FFF4E6; --sun:#FFC85C; --wall:#FFF6EA; --wall-line:#E7C9A8; --roof:#E2674F; --roof-d:#B9472F; --door:#C46A3E; --win-on:#FFD56B; --win-off:#EBDCCB; --ground:#E5CBA8; --path:#D7B48C; --smoke:#FFFFFF; --lift:0 14px 30px rgba(120,70,40,.16),0 3px 8px rgba(120,70,40,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211A15; --glow:#2E241D; --surface:#2B231D; --ink:#F4ECE2; --muted:#C2B1A2; --line:#40352C; --on:#211A15;
  --brand:#FF8C7A; --brand-s:#4A2620; --pink:#F59BBE; --pink-s:#45233A; --violet:#B9A3FF; --violet-s:#2F2750;
  --yellow:#FFC861; --yellow-s:#463613; --blue:#8CC4F5; --blue-s:#1E3448; --peach:#FFA772; --peach-s:#4A2C18;
  --l1:#8CC4F5; --l2:#FFC861; --l3:#FFA772; --l4:#FF8A9A; --sheen:rgba(255,255,255,.06); --sky1:#3A2C3A; --sky2:#2B231D; --sun:#F3D98A; --wall:#40342B; --wall-line:#5E4B3C; --roof:#D9654F; --roof-d:#A9473A; --door:#9E5A38; --win-on:#FFD56B; --win-off:#54463A; --ground:#3A2E24; --path:#4C3C2E; --smoke:#CDBFB2; --lift:0 14px 30px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211A15; --glow:#2E241D; --surface:#2B231D; --ink:#F4ECE2; --muted:#C2B1A2; --line:#40352C; --on:#211A15;
  --brand:#FF8C7A; --brand-s:#4A2620; --pink:#F59BBE; --pink-s:#45233A; --violet:#B9A3FF; --violet-s:#2F2750;
  --yellow:#FFC861; --yellow-s:#463613; --blue:#8CC4F5; --blue-s:#1E3448; --peach:#FFA772; --peach-s:#4A2C18;
  --l1:#8CC4F5; --l2:#FFC861; --l3:#FFA772; --l4:#FF8A9A; --sheen:rgba(255,255,255,.06); --sky1:#3A2C3A; --sky2:#2B231D; --sun:#F3D98A; --wall:#40342B; --wall-line:#5E4B3C; --roof:#D9654F; --roof-d:#A9473A; --door:#9E5A38; --win-on:#FFD56B; --win-off:#54463A; --ground:#3A2E24; --path:#4C3C2E; --smoke:#CDBFB2; --lift:0 14px 30px rgba(0,0,0,.45),0 3px 8px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px}
body{background-color:var(--on);background-image:radial-gradient(ellipse 70% 38% at 50% 0%,var(--glow),transparent 75%);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2.3rem;font-weight:800}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 120px;display:grid;gap:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.74rem;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.ic{width:22px;height:22px;flex:none}

/* top */
.top{display:flex;align-items:center;gap:12px}
.back{border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.top h2{flex:1;min-width:0}
.hearts{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--pink-s);color:var(--pink);padding:4px 10px;border-radius:999px;font-size:.9rem;border:0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(90,60,30,.05),0 6px 18px rgba(90,60,30,.05);display:grid;gap:10px;min-width:0}
.tint{border:0;box-shadow:0 2px 6px rgba(120,70,40,.06)}
.t-brand{background:var(--brand-s)} .t-pink{background:var(--pink-s)} .t-violet{background:var(--violet-s)}
.t-yellow{background:var(--yellow-s)} .t-blue{background:var(--blue-s)} .t-peach{background:var(--peach-s)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;border-radius:var(--r);padding:16px;display:grid;gap:4px;align-content:start;min-height:120px}
.tile .ic{width:26px;height:26px;margin-bottom:4px}
.tile b{font-family:var(--f-display);font-size:1.15rem;line-height:1.2}
.tile span{font-size:.86rem;color:var(--muted)}
.tile.wide{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr auto;align-items:center;column-gap:12px}
.tile.wide .ic{margin:0}
.chev{color:var(--muted);font-size:1.4rem}

.btn{border:2px solid var(--brand);background:var(--brand);color:var(--on);padding:12px 20px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--l4);background:transparent;color:var(--l4)}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:.92rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--brand);transition:width .35s}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1rem}
textarea{min-height:110px;resize:vertical}
label.lbl{font-weight:600;font-size:.92rem}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--yellow);padding-left:12px}

/* welcome */
.hero{display:grid;gap:14px;text-align:center;justify-items:center;padding-top:24px}
.logo{width:76px;height:76px;border-radius:24px;background:var(--brand-s);display:grid;place-items:center}
.logo svg{width:46px;height:46px}
.tagline{font-family:var(--f-display);font-size:1.3rem;color:var(--brand);font-weight:600}
.core{font-family:var(--f-display);font-size:1.2rem;line-height:1.35}
.role{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;border-radius:var(--r);padding:18px;border:2px solid transparent}
.role .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.role .av svg{width:30px;height:30px}
.role b{font-family:var(--f-display);font-size:1.2rem;display:block;line-height:1.2}
.role span{font-size:.9rem;color:var(--muted)}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatar{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;display:grid;place-items:center;max-width:100%}
.avatar[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-s)}
.priv{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.priv .ic{color:var(--brand);margin-top:2px}

/* survey */
.sv-q{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.3;min-height:3.8em}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;min-height:56px}
.opt b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:1.1rem}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-s)}
.opt[aria-pressed="true"] b{background:var(--brand);color:var(--on)}
.sv-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* result */
.lvbadge{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;padding:4px 12px;border-radius:999px;background:var(--surface)}
.lvbadge i{width:10px;height:10px;border-radius:50%}
.lvname{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
.wave{display:block;width:100%;height:90px}
.wave path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.scale4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scale4 div{display:grid;gap:4px;font-size:.76rem;color:var(--muted)}
.scale4 i{height:8px;border-radius:999px;opacity:.3}
.scale4 .on i{opacity:1}
.scale4 .on{color:var(--ink);font-weight:600}
.dim{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;font-size:.92rem}
.dim b{text-align:right;font-variant-numeric:tabular-nums}
.list{margin:0;padding-left:20px;display:grid;gap:4px}
.alert{border:2px solid var(--l4);border-radius:var(--r);padding:16px;display:grid;gap:8px;background:var(--surface)}
.alert h3{color:var(--l4)}

/* journey */
.weeks{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px}
.wk .let{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;font-weight:800}
.wk small{display:block;color:var(--muted);font-size:.8rem}
.wk b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.wk .st{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-done{background:var(--brand-s);color:var(--brand)}
.st-now{background:var(--yellow-s);color:var(--yellow)}
.st-open{background:var(--bg);color:var(--muted)}
.L-C{background:var(--brand-s);color:var(--brand)} .L-H{background:var(--pink-s);color:var(--pink)}
.L-A{background:var(--violet-s);color:var(--violet)} .L-M{background:var(--yellow-s);color:var(--yellow)}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:var(--bg)}
.step .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:2px}
.step[data-on="1"] .box{background:var(--brand);border-color:var(--brand);color:var(--on)}
.step b{display:block}
.step p{font-size:.93rem;color:var(--muted)}
.step .tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.step .go{margin-top:6px}
.tips{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.92rem}
.dishrow{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}

/* meal */
.tray{position:relative;border-radius:50%;aspect-ratio:1;max-width:340px;width:100%;margin:0 auto;background:radial-gradient(circle at 50% 50%,var(--surface) 0 58%,var(--yellow-s) 58% 100%);border:3px solid var(--yellow-s);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:16%;gap:6%}
.plate{display:grid;justify-items:center;align-content:center;gap:2px;text-align:center;font-size:.78rem;line-height:1.2;font-weight:600}
.plate svg{width:100%;max-width:84px;height:auto}
.plate.lock{color:var(--muted);font-weight:500}
.badge{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--violet-s);color:var(--violet);border:4px dashed var(--violet)}
.badge.on{border-style:solid;background:var(--violet);color:var(--on)}
.badge svg{width:56px;height:56px}

/* garden */
.pet svg,.tree svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
@keyframes float{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.pop{position:absolute;left:50%;top:30%;font-size:1.6rem;color:var(--pink);animation:float 1s ease-out forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}.track i{transition:none}}

/* diary & moments */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs .chip{white-space:nowrap}
.entry{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--bg)}
.entry .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.mini{border:0;background:none;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:0}
.photo{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:14px;display:block}
.photo .ph{width:96px;height:96px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;padding:6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:25px}
.hot{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hot .n{font-family:var(--f-display);font-size:2.4rem;font-weight:800;color:var(--pink);line-height:1;user-select:all}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.say{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.say div{padding:10px 12px;border-radius:12px;font-size:.9rem}
.say .no{background:var(--bg);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--l4)}
.say .yes{background:var(--brand-s)}
details.art{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.art summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.art summary::-webkit-details-marker{display:none}
details.art summary b{font-family:var(--f-display);font-size:1.08rem}
details.art .bd{padding:0 16px 16px;display:grid;gap:10px;font-size:.95rem}
.opener{font-family:var(--f-display);font-size:1.3rem;line-height:1.35;font-weight:600}
.flow{display:grid;gap:8px}
.flow div{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.flow span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand-s);color:var(--brand);font-family:var(--f-display);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on);padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:50;max-width:90vw;text-align:center}

/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);box-shadow:0 -4px 16px rgba(90,60,30,.06);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.bn button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 2px;font-size:.72rem;color:var(--muted);border-radius:14px}
nav.bn .ib{width:44px;height:32px;border-radius:12px;display:grid;place-items:center}
nav.bn button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.bn button[aria-current="page"] .ib{background:var(--brand-s);color:var(--brand)}


/* pastel sheen + hover lift */
.tint,.tile,.role,.t-brand,.t-pink,.t-violet,.t-yellow,.t-blue,.t-peach{background-image:linear-gradient(150deg,var(--sheen),transparent 62%)}
.tile,.role,.wk,.item,.day,.btn,.chip,.opt,button.card,.avatar,.swatch,details.art summary{transition:transform .22s cubic-bezier(.2,.8,.3,1),box-shadow .22s ease,background-color .2s ease}
.tile,.role,button.card,.wk,.item{box-shadow:0 2px 6px rgba(120,70,40,.07)}
@media (hover:hover) and (pointer:fine){
  .tile:hover,.role:hover,button.card:hover,.wk:hover,.item:not([disabled]):hover{transform:translateY(-5px);box-shadow:var(--lift)}
  .btn:not([disabled]):hover,.chip:not([disabled]):hover,.opt:hover,.day:not([disabled]):hover,.avatar:hover,.swatch:hover{transform:translateY(-2px);box-shadow:var(--lift)}
  .card:not(.tint):not(button){transition:box-shadow .22s ease}
  .card:not(.tint):not(button):hover{box-shadow:0 8px 22px rgba(120,70,40,.10)}
  nav.bn button:hover .ib{transform:translateY(-2px)}
}
.tile:active,.role:active,button.card:active,.wk:active,.item:active,.btn:active,.chip:active,.opt:active,.day:active{transform:scale(.98)}
nav.bn .ib{transition:transform .2s ease}

.house .smoke circle{fill:var(--smoke);animation:smoke 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.house .smoke circle:nth-child(2){animation-delay:1.05s}.house .smoke circle:nth-child(3){animation-delay:2.1s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(14px,-56px) scale(1.7);opacity:0}}
.hot-spot{cursor:pointer;transition:transform .25s ease;transform-box:fill-box;transform-origin:bottom center}
@media (hover:hover){.hot-spot:hover{transform:translateY(-4px) scale(1.03)}}
.hot-spot:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.86rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
@media (prefers-reduced-motion:reduce){.house .smoke circle{animation:none;opacity:.6}.hot-spot{transition:none}}


nav.bn[hidden]{display:none!important}
.gbtn{gap:10px}
/* survey v3 */
.sv-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.legend5{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}

.qcard{gap:12px}
.qtext{font-weight:500;font-size:1.02rem;display:flex;gap:10px}
.qn{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);color:var(--muted)}
.opts5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.o5{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;display:grid;justify-items:center;gap:4px;text-align:center;font-size:.72rem;line-height:1.2;color:var(--muted);min-height:64px}
.o5 b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:1rem;color:var(--ink)}

.n111{font-family:var(--f-display);font-size:1.8rem;font-weight:800;color:var(--l4);user-select:all}
.foot{display:flex;gap:10px;align-items:center;justify-content:center;font-size:.86rem;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line);text-align:left}

@media (max-width:420px){.o5 span{font-size:.62rem}.o5{min-height:72px;padding:6px 2px}}

.item .cost svg{width:14px;height:14px;filter:none;opacity:1}
.g2{display:grid;gap:18px;align-content:start}
.g2>*{min-width:0}
.col{display:grid;gap:18px;align-content:start;min-width:0}
.brand{display:none}

const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;

// Điểm thang chỉ tính khi trả lời đủ 80% số câu (OP, AV, BR ≥ 5/6; DS ≥ 4/5)
function scaleScores(ans){const raw={},miss=[];Object.keys(SCALES).forEach(k=>{const v=itemsOf(k).map(i=>ans[i.c]).filter(x=>typeof x==="number");raw[k]=v.length>=SCALES[k].need?mean(v):null;if(raw[k]==null)miss.push(k)});return {raw,miss}}
// CRI = [(6 − OP) + AV + (6 − DS) + BR] / 4
function criFrom(raw){const disp={OP:6-raw.OP,AV:raw.AV,DS:6-raw.DS,BR:raw.BR};return {disp,cri:(disp.OP+disp.AV+disp.DS+disp.BR)/4}}
const lvFromCRI=cri=>LV.find(l=>cri<l.max).n;
function scoreForm(role,sv){
  const {raw,miss}=scaleScores(sv.ans);if(miss.length)return {miss};
  const {disp,cri}=criFrom(raw),lvCRI=lvFromCRI(cri);

function whoCard(){const r=S.role,w=S.who[r]||{},hs=r==="hs";
  const sample=hs?ITEMS.find(x=>x.c==="OP2").hs:ITEMS.find(x=>x.c==="OP1").ph;
  return `<div class="card tint t-violet"><h3>${hs?"Khi trả lời, bạn đang nghĩ về ai?":"Bạn là ai với con?"}</h3>
   <p class="small">${hs?"Chọn người bạn thường trò chuyện nhất. Câu hỏi sẽ gọi đúng người đó để bạn dễ hình dung hơn.":"Câu hỏi sẽ xưng hô đúng như ở nhà để bạn dễ hình dung hơn."}</p>
   <div class="chips">${WHO[r].map(o=>`<button class="chip" data-a="whoPick" data-v="${o}" aria-pressed="${w.pick===o}">${o==="Bố mẹ"?"Cả bố và mẹ":o}</button>`).join("")}<button class="chip" data-a="whoPick" data-v="Khác" aria-pressed="${w.pick==="Khác"}">Người khác</button></div>
   ${w.pick==="Khác"?`<label class="lbl" for="whoc">${hs?"Bạn gọi người đó là gì?":"Con gọi bạn là gì?"}</label><input type="text" id="whoc" data-bind="whoCustom" maxlength="20" placeholder="Ví dụ: Cậu, Mợ, Thím, Dượng…" value="${esc(w.custom||"")}">`:""}
   ${hs?"":`<label class="lbl" for="whochild">Tên gọi ở nhà của con (không bắt buộc)</label><input type="text" id="whochild" data-bind="whoChild" maxlength="20" placeholder="Ví dụ: Bông, Tí, Su…" value="${esc(w.child||"")}">`}
   <div class="entry"><span class="small muted">Câu hỏi sẽ hiện như thế này</span><p id="whoPreview">“${esc(qText(sample))}”</p></div>
  </div>`}
function svSteps(){return ["intro","ctx","p0","p1","p2","p3"].concat(isHS()?["safe"]:[]).concat(["need","review"])}
function pageItems(p){let a=0;for(let i=0;i<p;i++)a+=PAGE_SIZES[i];return ORDER.slice(a,a+PAGE_SIZES[p])}
const capF=t=>t?t.charAt(0).toUpperCase()+t.slice(1):t;
function whoTerm(role){const w=(S.who||{})[role||S.role]||{};const t=w.pick==="Khác"?(w.custom||"").trim():(w.pick||"");return t?capF(t):""}
function childName(){return ((S.who||{}).ph||{}).child?S.who.ph.child.trim():""}
function personalized(role){role=role||S.role;return !!whoTerm(role)||(role==="ph"&&!!childName())}
// Đổi đại từ trong câu theo người được chọn; không chọn thì giữ nguyên văn bản bản 3
function qText(t,role){role=role||S.role;const who=whoTerm(role);
  if(role==="hs"){if(who)t=t.replace(/[Cc]ha mẹ/g,who);return t}
  if(who)t=t.replace(/(^|[\s(])[Tt]ôi(?=[\s,.?!)]|$)/g,(m,p)=>p+who);
  const c=childName();if(c)t=t.replace(/(^|[\s(])[Cc]on(?=[\s,.?!)]|$)/g,(m,p)=>p+c);
  return t}
const answered=sv=>ORDER.filter(c=>typeof sv.ans[c]==="number").length;
function qCard(code,text,cur,group,num){
  return `<div class="card qcard" id="q-${code}"><p class="qtext"><b class="qn">${num}</b>${esc(text)}</p>
   <div class="opts5" role="radiogroup" aria-label="Câu ${num}">${SCALE5.map((l,v)=>`<button class="o5" role="radio" aria-checked="${cur===v+1}" aria-pressed="${cur===v+1}" data-a="pick" data-v="${group}|${code}|${v+1}"><b>${v+1}</b><span>${l}</span></button>`).join("")}</div></div>`;
}
const legend5=`<div class="legend5">${SCALE5.map((l,i)=>`<span><b>${i+1}</b> ${l}</span>`).join("")}</div>`;

     <div class="card">${legend5}</div>
     <div class="card"><h3>Sau khi làm xong, bạn sẽ nhận được</h3><ul class="list"><li>Nhịp nhà nhìn từ phía bạn và hồ sơ bốn thang.</li><li>Điều đang làm tốt và điều cần quan tâm.</li><li>Một hành trình 4 tuần gợi ý, bạn có thể đổi nếu muốn.</li></ul></div>
     <button class="btn block" data-a="svNext">Bắt đầu</button>`;
  if(st==="ctx") return `${top(isHS()?"Một chút về bạn":"Một chút về gia đình",false)}

     ${SAFE.map((q,i)=>qCard(q.c,qText(q.t),sv.safe[q.c],"safe","+"+(i+1))).join("")}${nav("Tiếp tục")}`;
  if(st==="need") return `${bar}<p class="eyebrow">Tùy chọn</p><h2>Bạn có cần thêm hỗ trợ không?</h2><p class="muted">Bốn câu này chỉ dùng để gợi ý nguồn hỗ trợ, không tính vào kết quả.</p>
     ${NEED[S.role].map((q,i)=>qCard(q.c,qText(q.t),sv.need[q.c],"need","F"+(i+1))).join("")}${nav("Xem lại")}`;
  const {miss}=scaleScores(sv.ans);

     <div class="track"><i style="width:${done/n*100}%"></i></div>
     <div class="card"><h3>Bạn đã trả lời ${done}/${n} câu</h3>
     ${miss.length?`<p>Bạn còn một vài câu chưa trả lời, trả lời thêm để có kết quả đầy đủ hơn.</p><div class="chips">${miss.map(k=>`<button class="chip" data-a="svGoScale" data-v="${k}">Trả lời thêm phần “${SCALES[k].n}”</button>`).join("")}</div>`
      :`<p>Cảm ơn bạn đã dành thời gian. Bấm nút dưới đây để xem bản đồ kết nối của nhà mình.</p>`}</div>
     <button class="btn block" data-a="svFinish" ${miss.length?"disabled":""}>Xem nhịp nhà của mình</button>

function compareCard(r){
  if(!r.prevRaw)return "";
  const word=k=>{const d=r.raw[k]-r.prevRaw[k];return Math.abs(d)<0.05?"không đổi":d>0?"tăng":"giảm"};
  const a=LV[r.from-1],b=LV[r.lv-1];
  return `<div class="card tint t-blue"><p class="eyebrow" style="color:var(--blue)">So với lần đo trước</p>
   <h2><span style="color:${a.col}">${a.name}</span> → <span style="color:${b.col}">${b.name}</span></h2>
   <div class="cmp">${Object.keys(SCALES).map(k=>{const w=word(k);return `<div><span>${SCALES[k].n}</span><b>${w==="tăng"?"↑":w==="giảm"?"↓":"→"} ${w}</b></div>`}).join("")}</div>
   <p class="small muted">Cởi mở và Chủ động kể tăng là tín hiệu tốt; Né tránh và Rào cản giảm là tín hiệu tốt.</p></div>`;
}
function whyText(r,lv){
  if(r.flag&&lv===4)return isHS()?"Một vài câu trả lời của bạn cho thấy lúc này bạn nên có thêm người đồng hành, nên Nhịp Nhà gợi ý hành trình nhẹ nhàng, ưu tiên điểm tựa an toàn.":"Nhịp Nhà gợi ý hành trình này dựa trên các câu trả lời của bạn.";
  const L=LV[lv-1],lo=lv===1?null:LV[lv-2].max;
  return `Chỉ số CRI của bạn là ${r.cri.toFixed(2)}, nằm trong khoảng ${lo==null?"dưới 2,5":lv===4?"từ 3,5 trở lên":`từ ${String(lo).replace(".",",")} đến dưới ${String(L.max).replace(".",",")}`}. Thang cần quan tâm nhất: ${SCALES[r.worst].n}.`;
}
function resultBody(r,showActions){
  const L=LV[r.lv-1],role=r.role,pick=V.pick||S.choice[(role)+":"+((S.hist[role]||[]).length)]||r.lv;
  const tips=NEED[role].map(q=>{const v=r.need[q.c],t=NEED_TIP[role][q.c];if(typeof v!=="number")return null;if(t.low?v<=2:v>=4)return t;return null}).filter(Boolean);
  const brItem=r.brTop?qText(ITEMS.find(i=>i.c===r.brTop)[role],role):null;
  return `

// Thẻ "hôm nay" và dải 7 ngày dùng chung cho Trang chủ và màn Tuần
function dayStrip(l,w){
  const s=jr(l),d=s.days[w]||{},td=dayToday(l,w);
  return `<div class="days" role="group" aria-label="7 ngày của tuần ${w+1}">${[1,2,3,4,5,6,7].map(n=>{const on=!!d[n],fut=n>td;return `<button class="day${n===td?" today":""}" data-a="tick" data-v="${w}-${n}" aria-pressed="${on}" ${fut?"disabled":""} aria-label="Ngày ${n}${on?", đã làm":""}${fut?", chưa tới":""}"><span>Ngày</span><b>${n}</b><span class="dot">${on?ic("check"):""}</span></button>`}).join("")}</div>`;
}
function dailyCard(l,w,compact){
  const s=jr(l),wk=J[l][w],me=wk[S.role],td=dayToday(l,w),on=!!(s.days[w]||{})[td],n=daysDone(l,w),st=streak();
  return `<div class="card tint t-yellow">
    <div class="row" style="justify-content:space-between"><p class="eyebrow" style="color:var(--yellow)">Hôm nay · Ngày ${td}/7 · Tuần ${w+1}</p>${st>1?`<span class="streak">${ic("spark")}${st} ngày liên tiếp</span>`:""}</div>
    <h3>${esc(me.t)}</h3>${compact?"":`<p class="small">${esc(me.d)}</p>`}
    ${on?`<button class="btn quiet block bigcheck" data-a="tick" data-v="${w}-${td}">${ic("check")} Đã giữ nhịp hôm nay</button>`:`<button class="btn block bigcheck" data-a="tick" data-v="${w}-${td}">Mình đã làm hôm nay · +1 nhịp thương</button>`}
    ${dayStrip(l,w)}
    <p class="small muted">${n}/7 ngày · cần ${DAYS_NEEDED} ngày để hoàn thành tuần${compact?` · <button class="link" data-a="openWeek" data-v="${w}">Xem chi tiết tuần</button>`:""}</p>
  </div>`;
}
function dishName(l,i){const k=J[l][i].dish;if(k==="fav")return jr(l).fav||DISH.fav.n;return DISH[k].n}

VIEWS.week=()=>{
  const l=curLevel(),i=V.wk,wk=J[l][i],s=jr(l),me=wk[S.role],other=wk[isHS()?"ph":"hs"],k=LET[i];
  const step=(key,title,desc,tag,go,a)=>{const on=!!s.steps[i+"-"+key];return `
    <div class="step" data-on="${on?1:0}"><button class="box" data-a="step" data-v="${key}" role="checkbox" aria-checked="${on}" aria-label="Đánh dấu ${esc(title)}">${on?ic("check","ic"):""}</button>
    <div><b>${esc(title)}${tag?`<span class="tag">${tag}</span>`:""}${basisTag(a)}</b><p>${esc(desc)}</p>${go?`<div class="go">${goBtn(go)}</div>`:""}${whyBtn(a)}</div></div>`};
  const tips=wk.tip.filter(t=>!t.role||t.role===S.role);
  const td=dayToday(l,i),n=daysDone(l,i),ready=n>=DAYS_NEEDED;
  return `
   ${top(`Tuần ${i+1}`,true,heartsBtn())}
   <div class="row"><span class="let L-${k}" style="width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;font-weight:800">${k}</span><div style="flex:1;min-width:0"><p class="eyebrow">${LETN[k]} · ${LV[l-1].name}</p><h2>${esc(wk.t)}</h2></div></div>
   <div class="g2 wide-l"><div class="col">
   <div class="card"><h3>Nhiệm vụ mỗi ngày của ${isHS()?"bạn":"bố mẹ"}</h3>
     <div class="step" data-on="0" style="grid-template-columns:1fr"><div><b>${esc(me.t)}${basisTag(me)}</b><p>${esc(me.d)}</p>${me.go?`<div class="go">${goBtn(me.go)}</div>`:""}${whyBtn(me)}</div></div>
     <p class="small muted">Làm mỗi ngày rồi đánh dấu ngày đó bên dưới. Mỗi ngày nhận 1 nhịp thương. Lỡ một ngày cũng không sao, bạn có thể đánh dấu bù những ngày đã qua.</p>
     ${dayStrip(l,i)}
     <div class="track" aria-hidden="true"><i style="width:${Math.min(100,n/DAYS_NEEDED*100)}%"></i></div>
     <p class="small"><b>${n}/7 ngày</b> · ${ready?"Đủ để hoàn thành tuần":`cần thêm ${DAYS_NEEDED-n} ngày để hoàn thành tuần`}</p>
     <label class="lbl" for="dnote">Một dòng cho ngày ${td} (không bắt buộc)</label>
     <input type="text" id="dnote" data-bind="dnote" maxlength="140" placeholder="Ví dụ: Hôm nay con kể chuyện bạn cùng phòng, cả nhà cười rất vui." value="${esc(((s.dnote[i]||{})[td])||"")}">
   </div>
   ${wk.sh.length?`<div class="card"><h3>${l===4?"Hoạt động có thể làm riêng":"Hoạt động chung trong tuần"}</h3>${wk.sh.map((a,j)=>step("s"+j,a.t,a.d,a.solo||l===4?"làm riêng cũng được":"khi cả hai muốn",a.go,a)).join("")}<p class="small muted">Hoạt động chung làm một lần trong tuần, chỉ đánh dấu khi cả hai tự nguyện tham gia (+1 nhịp thương). Không làm cũng không sao.</p></div>`:""}
   </div><div class="col">
   ${tips.length?`<div class="card tint t-yellow"><h3>Gợi ý</h3><ul class="tips">${tips.map(t=>`<li>${esc(t.t)}${t.go?` ${goBtn(t.go,"link")}`:""}</li>`).join("")}</ul></div>`:""}
   <details class="art"><summary><b>Người thân của bạn sẽ làm gì?</b><span class="chev">›</span></summary><div class="bd"><p><b>${esc(other.t)}</b></p><p class="muted">${esc(other.d)}</p></div></details>
   ${dnoteList(l,i)}
   ${wk.dish?`<div class="card tint t-peach"><div class="dishrow">${s.done[i]?dishSVG(wk.dish):`<span style="color:var(--muted)">${lockSVG}</span>`}<div><p class="eyebrow" style="color:var(--peach)">Món mở khóa tuần này</p><h3>${s.done[i]?esc(dishName(l,i)):"Hoàn thành nhiệm vụ để mở khóa"}</h3>${s.done[i]?`<p class="small">${esc(DISH[wk.dish].m)}</p>`:""}</div></div></div>`
     :(i===3?`<div class="card tint t-violet"><p>Hoàn thành tuần này để khép lại hành trình và nhận huy hiệu “Nhịp nhà bền lâu”.</p></div>`:"")}
   ${s.done[i]||s.skip[i]?fbCard(s,i):""}
   ${s.done[i]?`<button class="btn quiet block" data-a="undoWeek">Đánh dấu chưa xong</button>`
     :s.skip[i]?`<div class="card"><p>Bạn đã bỏ qua tuần này. Không sao cả, bạn có thể quay lại bất cứ lúc nào.</p><button class="btn quiet" data-a="unskipWeek">Làm lại tuần này</button></div>`
     :`<button class="btn block" data-a="doneWeek" ${ready?"":"disabled"}>Hoàn thành tuần ${i+1}${wk.dish?" & mở khóa món":""}</button>${ready?"":`<p class="small muted" style="text-align:center">Giữ nhịp đủ ${DAYS_NEEDED}/7 ngày để hoàn thành tuần.</p>`}
       <button class="btn quiet block" data-a="skipWeek">Bỏ qua tuần này</button>`}
   </div></div>`;
};
// Phản hồi sau mỗi tuần: có hữu ích không, có cảm thấy bị ép không
function fbCard(s,i){const f=s.fb[i]||{};const row=(k,q,opts)=>`<span class="lbl">${q}</span><div class="chips">${opts.map(o=>`<button class="chip" data-a="fb" data-v="${k}|${o}" aria-pressed="${f[k]===o}">${o}</button>`).join("")}</div>`;
  return `<div class="card tint t-blue"><h3>Tuần này thế nào với bạn?</h3>${row("useful","Hoạt động tuần này có hữu ích không?",["Có","Một chút","Không"])}${row("forced","Bạn có cảm thấy bị ép không?",["Không","Một chút","Có"])}${f.useful&&f.forced?`<p class="small muted">Cảm ơn bạn đã chia sẻ.</p>`:""}</div>`}
// badge cơ sở hoạt động: điền basis ("lt" có cơ sở lý thuyết / "tn" đang thử nghiệm) và why trong J để hiển thị
function basisTag(a){if(!a||!a.basis)return "";return `<span class="tag">${a.basis==="lt"?"có cơ sở lý thuyết":"đang thử nghiệm"}</span>`}
function whyBtn(a){if(!a||!a.why)return "";return `<details class="why"><summary>Vì sao có hoạt động này</summary><p class="small">${esc(a.why)}</p></details>`}
function dnoteList(l,i){const d=jr(l).dnote[i]||{},ks=Object.keys(d).filter(k=>d[k]).sort((a,b)=>a-b);if(!ks.length)return "";
  return `<div class="card"><h3>Nhật ký 7 ngày</h3>${ks.map(k=>`<div class="entry"><div class="meta"><span>Ngày ${k}</span></div><p>${esc(d[k])}</p></div>`).join("")}</div>`}
function goBtn(go,cls="btn quiet"){
  const lab={garden:"Mở vườn nhà",moments:"Mở Khoảnh khắc",meal:"Xem mâm cơm",library:"Mở thư viện giải pháp",openers:"Xem câu mở lời",support:"Mở Trạm hỗ trợ","diary:secret":isHS()?"Viết vào Điều chưa nói":"Viết vào Góc lắng nghe","diary:thanks":"Mở Nhật ký lòng biết ơn","diary:letter":"Viết thư","diary:pact":"Lập thỏa thuận"}[go]||"Mở";
  return `<button class="${cls}" data-a="goto" data-v="${go}" style="${cls==="btn quiet"?"min-height:40px;padding:6px 14px;font-size:.9rem":""}">${lab}</button>`;
}

    return `${top("Huy hiệu hành trình")}
     <div class="card" style="text-align:center"><div class="badge ${done===4?"on":""}">${ic("medal")}</div><h2>Nhịp nhà bền lâu</h2><p class="muted">${done===4?"Bạn đã đi hết hành trình “Tìm điểm tựa an toàn”.":`Đã đi ${done}/4 tuần. Không cần vội, mỗi tuần một bước nhỏ.`}</p></div>
     <div class="card tint t-pink"><p>Ở Nhịp ngắt, hành trình không đặt mục tiêu ngồi chung mâm cơm. Điều quan trọng là bạn có không gian an toàn và người đồng hành phù hợp.</p></div>
     ${done===4?`<div class="card"><label class="lbl" for="happy">Nhìn lại hành trình: điều bạn cảm thấy vui nhất là gì?</label><textarea id="happy" data-bind="happy">${esc(s.happy)}</textarea></div>`:""}
     <div class="weeks">${J[4].map((w,i)=>`<button class="wk" data-a="openWeek" data-v="${i}"><span class="let L-${LET[i]}">${LET[i]}</span><span><small>Tuần ${i+1}</small><b>${esc(w.t)}</b></span><span class="st ${s.done[i]?"st-done":"st-open"}">${s.done[i]?"Đã xong":"Chưa"}</span></button>`).join("")}</div>`;
  }

   <p class="muted">Mỗi tuần hoàn thành sẽ mở khóa một món ăn. Sau 4 tuần, mâm cơm nhà mình hoàn thiện.</p>
   <div class="tray" role="img" aria-label="Mâm cơm: ${done} trên 4 món đã mở khóa">${keys.map((k,i)=>s.done[i]?`<div class="plate">${dishSVG(k)}<span>${esc(dishName(l,i))}</span></div>`:`<div class="plate lock">${lockSVG}<span>Tuần ${i+1}</span></div>`).join("")}</div>
   <div class="track"><i style="width:${done/4*100}%"></i></div><p class="small muted" style="text-align:center">${done}/4 món</p>
   ${keys.includes("fav")?`<div class="card tint t-peach"><label class="lbl" for="fav">Món yêu thích cả nhà cùng chọn (món tuần 4)</label><input type="text" id="fav" data-bind="fav" maxlength="40" placeholder="Ví dụ: Lẩu mắm, bánh xèo…" value="${esc(s.fav)}"></div>`:""}
   <div class="stack">${keys.map((k,i)=>`<div class="card" style="grid-template-columns:auto 1fr;align-items:center;column-gap:14px"><span class="let L-${LET[i]}" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem">${LET[i]}</span><div><b>${s.done[i]?esc(dishName(l,i)):"Món bí mật"}</b><p class="small muted">${s.done[i]?esc(DISH[k].m):`Hoàn thành tuần ${i+1}: ${esc(J[l][i].t)}`}</p></div></div>`).join("")}</div>
   ${done===4?`<div class="card tint t-brand"><h3>Mâm cơm gia đình hoàn chỉnh</h3><p>${l===3?"Sau 4 tuần cùng nhau vun đắp, thấu hiểu và gỡ rối, mâm cơm nhà mình đã hoàn thiện: cơm trắng dẻo thơm, mắm chưng đậm đà, rau sống thanh mát và bát canh khoai ấm lòng.":"Khép lại hành trình gắn kết – Mở ra những yêu thương bền chặt mỗi ngày."}</p><p class="small">Hãy cùng ngồi lại một bữa cơm thật, trò chuyện về những điều tích cực mà không phán xét hay trách móc.</p></div>`:""}`;
};

VIEWS.diary=()=>{
  const t=V.dtab;
  const tabs=[["secret",isHS()?"Điều chưa nói":"Góc lắng nghe"],["thanks","Lòng biết ơn"],["letter","Hòm thư"],["pact","Thỏa thuận nhà mình"]];
  let body="";
  if(t==="pact"){
    const p=S.pact;
    body=`<div class="card"><h3>Thỏa thuận giao tiếp của nhà mình</h3><p class="small muted">Chọn những nguyên tắc cả nhà cùng đồng ý. Nên thống nhất trực tiếp với người thân trước khi lưu.</p>
      ${PACT_RULES.concat(p.custom).map(r=>{const on=p.rules.includes(r);return `<div class="step" data-on="${on?1:0}"><button class="box" data-a="pactRule" data-v="${esc(r)}" role="checkbox" aria-checked="${on}" aria-label="${esc(r)}">${on?ic("check"):""}</button><div><b>${esc(r)}</b></div></div>`}).join("")}
      <div class="row"><input type="text" id="pactnew" placeholder="Thêm nguyên tắc riêng của nhà mình" maxlength="60" style="flex:1;min-width:0"><button class="btn quiet" data-a="pactAdd">Thêm</button></div></div>
     <div class="card"><h3>Lịch liên lạc</h3><label class="lbl" for="pactwhen">Thời gian</label><input type="text" id="pactwhen" data-bind="pactwhen" placeholder="Ví dụ: 20 phút mỗi tối, sau 21h00" value="${esc(p.when)}">
      <span class="lbl">Hình thức</span><div class="chips">${PACT_WAYS.map(w=>`<button class="chip" data-a="pactWay" data-v="${w}" aria-pressed="${p.ways.includes(w)}">${w}</button>`).join("")}</div></div>
     <button class="btn block" data-a="pactSave">Lưu thỏa thuận</button>
     ${p.saved?`<div class="card tint t-brand"><h3>Đã lưu ngày ${esc(p.saved)}</h3><p style="white-space:pre-wrap">${esc(pactText())}</p><button class="btn quiet" data-a="copy" data-v="${esc(pactText())}">Sao chép để gửi người thân</button></div>`:""}`;
  } else {
    const label={secret:isHS()?"Điều con chưa nói":"Góc lắng nghe",thanks:"Nhật ký lòng biết ơn",letter:"Hòm thư yêu thương"}[t];
    const hint={secret:isHS()?"Góc riêng tư của bạn. Viết ra những điều chưa nói được; không ai đọc được nếu bạn không chia sẻ.":"Ghi lại những gì bạn nhận ra khi trò chuyện với con: câu nói hiệu quả, câu nói làm con im lặng.",thanks:"Cảm ơn hoặc xin lỗi, thật cụ thể. Bạn có thể sao chép để gửi, hoặc giữ cho riêng mình.",letter:"Viết điều bạn trân trọng hoặc mong người thân thấu hiểu. Thư chỉ được gửi khi bạn tự sao chép và gửi đi."}[t];
    const d=V.draft;
    const list=S.diary.filter(e=>e.type===t).slice().reverse();
    body=`<div class="card"><h3>${label}</h3><p class="small muted">${hint}</p>
      ${t==="thanks"?`<div class="chips">${["Cảm ơn","Xin lỗi"].map(k=>`<button class="chip" data-a="dsub" data-v="${k}" aria-pressed="${(d.sub||"Cảm ơn")===k}">${k}</button>`).join("")}</div>`:""}
      ${t==="letter"?`<label class="lbl" for="dto">Gửi đến</label><input type="text" id="dto" data-draft="to" placeholder="${isHS()?"Ví dụ: Mẹ":"Ví dụ: Con gái yêu"}" value="${esc(d.to||"")}">`:""}
      <span class="lbl">Cảm xúc lúc này</span><div class="chips">${MOODS.map(m=>`<button class="chip" data-a="dmood" data-v="${m}" aria-pressed="${d.mood===m}">${m}</button>`).join("")}</div>
      <label class="lbl" for="dtext">Nội dung</label><textarea id="dtext" data-draft="text" placeholder="${t==="thanks"?"Ví dụ: Cảm ơn mẹ đã gửi thêm áo ấm.":"Viết ở đây…"}">${esc(d.text||"")}</textarea>
      <button class="btn" data-a="dsave">Lưu</button></div>
     <div class="stack">${list.length?list.map(e=>`<div class="entry"><div class="meta"><span>${esc(e.date)}${e.sub?" · "+esc(e.sub):""}${e.to?" · Gửi "+esc(e.to):""}</span><span>${esc(e.mood||"")}</span></div><p>${esc(e.text)}</p><div class="row" style="gap:14px">${t!=="secret"?`<button class="mini" data-a="copy" data-v="${esc((e.to?e.to+" ơi,\n":"")+e.text)}">Sao chép để gửi</button>`:""}<button class="mini" data-a="ddel" data-v="${e.id}">Xóa</button></div></div>`).join(""):`<p class="small muted" style="text-align:center">Chưa có ghi chép nào.</p>`}</div>`;
  }
  return `<div class="top"><div style="flex:1"><p class="eyebrow">Góc sẻ chia</p><h2>Nhật ký</h2></div>${heartsBtn()}</div>
   <div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button class="chip" role="tab" data-a="dtab" data-v="${k}" aria-pressed="${t===k}" aria-selected="${t===k}">${n}</button>`).join("")}</div>${body}`;
};
function pactText(){const p=S.pact;return "Thỏa thuận giao tiếp của nhà mình\n"+p.rules.map(r=>"• "+r).join("\n")+(p.when?"\nLịch liên lạc: "+p.when:"")+(p.ways.length?"\nHình thức: "+p.ways.join(", "):"")}

   <div class="card"><h3>Quyền riêng tư</h3>

// Dữ liệu ẩn danh để nhóm nghiên cứu tổng hợp (chỉ gửi khi người dùng đồng ý)
function researchData(){
  const forms=(S.hist[S.role]||[]).map(r=>({form:r.id,ver:r.ver,who:r.who,attempt:r.attempt,start:r.start?new Date(r.start).toISOString():null,end:r.end?new Date(r.end).toISOString():null,pageMs:r.pageMs,
    answers:r.ans,safety:r.role==="hs"?r.safe:undefined,support:r.need,context:r.ctx,
    scores:{raw:r.raw,reversed:r.disp,CRI:+r.cri.toFixed(4),lvByCRI:r.lvCRI,safetyFlag:r.flag,flagCount:r.flagCount,lvFinal:r.lv,lvChosen:r.chosen||r.lv},quality:r.quality}));
  const journeys=Object.keys(S.j).filter(k=>k.startsWith(S.role+":")).map(k=>{const s=S.j[k],p=k.split(":");return {cycle:+p[1],level:+p[2],
    weeks:[0,1,2,3].map(w=>({week:w+1,status:s.done[w]?"done":s.skip[w]?"skipped":"open",days:Object.values((s.days||{})[w]||{}).filter(Boolean).length,at:s.done[w]||s.skip[w]||null,feedback:(s.fb||{})[w]||null}))}});
  return {anon:S.anon,role:S.role,consentAt:S.consent?new Date(S.consent).toISOString():null,exportedAt:new Date().toISOString(),forms,journeys};
}

// Dán cấu hình "firebaseConfig" của Firebase (Project settings → Your apps → Web) vào đây.
// Đây là mã định danh công khai của dự án, không phải mật khẩu. Để null thì web ẩn chức năng đăng nhập.
const FIREBASE_CONFIG=null;
// Giới hạn email được đăng nhập, ví dụ "fpt.edu.vn". Để trống thì mọi tài khoản Google đều đăng nhập được.
const ALLOWED_EMAIL_DOMAIN="";
const FB_VER="10.12.2";
const CLOUD={on:!!FIREBASE_CONFIG,ready:false,user:null,busy:false,last:0,err:"",conflict:null,timer:null,clearOnLogout:true,confirmDel:false};
let fbAuth=null,fbDb=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load "+src));document.head.appendChild(s)})}
async function cloudInit(){
  if(!CLOUD.on)return;
  try{
    for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth();fbDb=firebase.firestore();
    CLOUD.ready=true;
    fbAuth.getRedirectResult().catch(e=>authError(e));
    fbAuth.onAuthStateChanged(u=>{onUser(u).catch(e=>{CLOUD.err="Không đọc được dữ liệu trên tài khoản.";CLOUD.busy=false;render()})});
  }catch(e){CLOUD.err="Không tải được dịch vụ đăng nhập. Kiểm tra kết nối mạng.";render()}
}
function authError(e){
  const m={"auth/unauthorized-domain":"Tên miền này chưa được cho phép trong Firebase (Authentication → Settings → Authorized domains).","auth/popup-closed-by-user":"Bạn đã đóng cửa sổ đăng nhập.","auth/cancelled-popup-request":"","auth/network-request-failed":"Lỗi mạng, hãy thử lại."}[e&&e.code];
  if(m===""||!e)return;toast(m||"Đăng nhập chưa thành công. Hãy thử lại.");
}
const docRef=uid=>fbDb.collection("users").doc(uid);
function hasLocalData(){return S.onb&&((S.hist.hs||[]).length+(S.hist.ph||[]).length>0||Object.keys(S.j||{}).length>0||(S.diary||[]).length>0)}
// Dữ liệu gửi lên: không gửi ảnh; nhật ký chỉ gửi khi người dùng bật
function cloudPayload(){const c=JSON.parse(JSON.stringify(S));c.mom.photos=[];if(!S.syncDiary){c.diary=[]}delete c.cloudUid;return JSON.stringify(c)}
async function onUser(u){
  if(!u){CLOUD.user=null;CLOUD.conflict=null;render();return}
  const email=(u.email||"").toLowerCase();
  if(ALLOWED_EMAIL_DOMAIN&&!email.endsWith("@"+ALLOWED_EMAIL_DOMAIN.toLowerCase())){await fbAuth.signOut();toast("Chỉ email @"+ALLOWED_EMAIL_DOMAIN+" được đăng nhập.");return}
  CLOUD.user={uid:u.uid,email:u.email,name:u.displayName,photo:u.photoURL};CLOUD.busy=true;render();
  const snap=await docRef(u.uid).get();CLOUD.busy=false;
  const remote=snap.exists?snap.data():null;
  if(!remote){S.cloudUid=u.uid;saveLocal();await cloudPush();render();return}
  if(S.cloudUid===u.uid||!hasLocalData()){
    if(S.cloudUid===u.uid&&(S.localAt||0)>(remote.clientAt||0)){await cloudPush()}else{adopt(remote)}
    render();return}
  CLOUD.conflict=remote;V.view="profile";render();
}
function adopt(remote){
  let c={};try{c=JSON.parse(remote.state)}catch(e){}
  const keepPhotos=S.mom.photos||[],keepDiary=S.diary||[];
  S=Object.assign(blank(),c);S.pet=Object.assign(blank().pet,S.pet||{});S.set=Object.assign(blank().set,S.set||{});S.who=Object.assign({hs:{},ph:{}},S.who||{});
  S.mom=Object.assign(blank().mom,S.mom||{});S.mom.photos=keepPhotos;if(!S.syncDiary||!(S.diary||[]).length)S.diary=keepDiary;
  S.cloudUid=CLOUD.user.uid;S.localAt=remote.clientAt||Date.now();CLOUD.last=remote.clientAt||Date.now();CLOUD.conflict=null;
  saveLocal();if(S.onb&&["welcome","role","setup"].includes(V.view))V.view="home";toast("Đã tải dữ liệu từ tài khoản của bạn");
}
async function cloudPush(){
  if(!CLOUD.user||!fbDb)return;
  try{const at=Date.now();await docRef(CLOUD.user.uid).set({state:cloudPayload(),ver:3,clientAt:at,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});CLOUD.last=at;CLOUD.err="";if(V.view==="profile")render()}
  catch(e){CLOUD.err="Chưa đồng bộ được, sẽ thử lại khi bạn thao tác tiếp.";if(V.view==="profile")render()}
}
function cloudSchedule(){if(!CLOUD.user||S.cloudUid!==CLOUD.user.uid||CLOUD.conflict)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,1500)}

 pactWay:v=>{const w=S.pact.ways;const i=w.indexOf(v);i>=0?w.splice(i,1):w.push(v);save();render()},
 pactSave:()=>{if(!S.pact.rules.length){toast("Chọn ít nhất một nguyên tắc.");return}S.pact.saved=today();save();render();toast("Đã lưu thỏa thuận của nhà mình")},
 momDone:v=>{S.mom.done[v]=!S.mom.done[v];if(S.mom.done[v])reward(0,"mom"+v,1);save();render()},
 phHide:v=>{const p=S.mom.photos.find(x=>x.id===v);if(p)p.hidden=!p.hidden;save();render()},
 phDel:v=>{S.mom.photos=S.mom.photos.filter(x=>x.id!==v);save();render()},
 tog:v=>{S.set[v]=!S.set[v];save();render()},
 switchRole:()=>{S.role=isHS()?"ph":"hs";save();render();toast("Đã đổi vai trò")},
 login:()=>{if(!CLOUD.ready)return;const p=new firebase.auth.GoogleAuthProvider();const q={prompt:"select_account"};if(ALLOWED_EMAIL_DOMAIN)q.hd=ALLOWED_EMAIL_DOMAIN;p.setCustomParameters(q);
   fbAuth.signInWithPopup(p).catch(e=>{if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code))fbAuth.signInWithRedirect(p);else authError(e)})},
 logout:async()=>{if(!CLOUD.user)return;clearTimeout(CLOUD.timer);await cloudPush();await fbAuth.signOut();
   if(CLOUD.clearOnLogout){try{localStorage.removeItem(KEY)}catch(e){}S=blank();V={view:"welcome",prev:[],sv:null,wk:0,dtab:"secret",res:null,pick:null,opener:0,confirmWipe:false,draft:{}}}
   else{delete S.cloudUid;saveLocal()}render();toast("Đã đăng xuất")},
 syncNow:()=>{CLOUD.busy=true;render();cloudPush().then(()=>{CLOUD.busy=false;render();toast("Đã đồng bộ")})},
 cloudDiary:()=>{S.syncDiary=!S.syncDiary;save();render()},
 cloudClear:()=>{CLOUD.clearOnLogout=!CLOUD.clearOnLogout;render()},
 useCloud:()=>{const r=CLOUD.conflict;if(r){adopt(r);render()}},
 useLocal:()=>{CLOUD.conflict=null;S.cloudUid=CLOUD.user.uid;saveLocal();cloudPush().then(()=>toast("Đã lưu dữ liệu trên máy này lên tài khoản"));render()},
 cloudDelete:async()=>{if(!CLOUD.confirmDel){CLOUD.confirmDel=true;render();return}CLOUD.confirmDel=false;try{await docRef(CLOUD.user.uid).delete();delete S.cloudUid;saveLocal();await fbAuth.signOut();toast("Đã xóa dữ liệu trên tài khoản và đăng xuất")}catch(e){toast("Chưa xóa được, hãy thử lại.")}render()},
 wipe:()=>{if(!V.confirmWipe){V.confirmWipe=true;render();return}try{localStorage.removeItem(KEY)}catch(e){}S=blank();V={view:"welcome",prev:[],sv:null,wk:0,jl:null,dtab:"secret",res:null,opener:0,confirmWipe:false,draft:{}};render();toast("Đã xóa toàn bộ dữ liệu")}
};
// thưởng ngoài hành trình (khoảnh khắc) dùng sổ riêng
const _reward=reward;reward=function(l,key,n){if(l===0){S.mom.rew=S.mom.rew||{};if(S.mom.rew[key])return;S.mom.rew[key]=1;S.hearts+=n;toast(`+${n} nhịp thương`);return}_reward(l,key,n)};

document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.v)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-a][role=button]:not(button)")){e.preventDefault();const f=ACT[e.target.dataset.a];if(f)f(e.target.dataset.v)}});
document.addEventListener("input",e=>{
  const el=e.target,b=el.dataset.bind,dr=el.dataset.draft;
  if(dr){V.draft[dr]=el.value;return}
  if(!b)return;const v=el.value,l=curLevel();
  if(b==="nick")S.nick=v;else if(b==="petname")S.pet.name=v||"Bé Chạm";else if(b==="treename")S.tree.name=v;else if(b==="treemsg")S.tree.msg=v;
  else if(b==="wnote")jr(l).note[V.wk]=v;
  else if(b==="whoCustom"||b==="whoChild"){const w=S.who[S.role]=S.who[S.role]||{};if(b==="whoCustom")w.custom=v;else w.child=v;
    const pv=$("#whoPreview");if(pv){const sample=isHS()?ITEMS.find(x=>x.c==="OP2").hs:ITEMS.find(x=>x.c==="OP1").ph;pv.textContent="“"+qText(sample)+"”"}}
  else if(b==="dnote"){const s=jr(l);s.dnote[V.wk]=s.dnote[V.wk]||{};s.dnote[V.wk][dayToday(l,V.wk)]=v}else if(b==="fav")jr(l).fav=v;else if(b==="happy")jr(l).happy=v;else if(b==="pactwhen")S.pact.when=v;
  save();
});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset.file||!el.files||!el.files[0])return;const ch=+el.dataset.file,file=el.files[0];
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    const s=Math.min(1,360/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);let url="";try{url=c.toDataURL("image/jpeg",.7)}catch(err){}
    const cap=MOM[ch].cap[S.role][0];S.mom.photos.push({id:uid(),ch,img:url,cap,date:today(),hidden:false});
    if(S.mom.photos.length>12)S.mom.photos.shift();S.mom.done[ch]=true;reward(0,"mom"+ch,1);save();render()};img.src=rd.result};rd.readAsDataURL(file);
});

const h=(location.hash||"").slice(1);
if(S.onb&&NAV.some(n=>n[0]===h))V.view=h;
render();
cloudInit();
})();
</script>
</body>
</html>
